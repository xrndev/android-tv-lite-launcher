# EXPERIMENTAL: este flujo se escribio pero NO se ha podido ejecutar en GitHub Actions todavia.
# La misma suite de integracion si se ha ejecutado en local contra el perfil atv11-1gb (ver docs/DEVICES.md).
name: Emulador (integracion)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Se lanza a mano: cada perfil tarda varios minutos"
        required: false

jobs:
  integration:
    name: Android API ${{ matrix.api }} con ${{ matrix.ram }} MB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 28, ram: 1024 }
          - { api: 30, ram: 1024 }
          - { api: 34, ram: 2048 }
    steps:
      - uses: actions/checkout@v4

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: "Compilar el launcher (build-tools 35, porque el d8 de 34 falla con algunos .class)"
        run: |
          sdkmanager "build-tools;35.0.0" "platforms;android-30"
          bash launcher/build.sh

      - name: Instalar tvlite
        run: python -m pip install -e "installer[dev]"

      - name: Pruebas de integracion en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TVLITE_EMULATOR: "1"
          TVLITE_EXPECT_RAM_MB: ${{ matrix.ram }}
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          ram-size: ${{ matrix.ram }}M
          disable-animations: true
          script: python -m pytest installer/tests/integration -v
