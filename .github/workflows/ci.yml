name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Pruebas unitarias (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: python -m pip install -e "installer[dev]"
      - name: Pruebas (la GUI se salta si no hay pantalla)
        working-directory: installer
        run: python -m pytest -q
