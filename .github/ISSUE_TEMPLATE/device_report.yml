name: Device report
description: Tell us how tvlite behaved on your TV
title: "[Device] Brand Model"
labels: [device-report]
body:
  - type: input
    id: tv
    attributes:
      label: TV (brand, model, Android version)
      placeholder: TCL 55P615, Android 11
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of `tvlite report <ip>`
      description: It is anonymous and nothing is sent. Read it before pasting.
      render: text
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: What did you try?
      options:
        - Only the report
        - Dry run (apply --dry-run)
        - Applied and restore worked
        - Applied, something went wrong
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Did it boot? Does Home open the launcher? Did restore bring every package back?
